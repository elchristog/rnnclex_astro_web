name: Corregir imagenes

# Ejecucion manual: corrige rutas de imagenes, guarda en main y vuelve a publicar el sitio.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corregir rutas
        run: node scripts/fix-images.mjs
      - name: Guardar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ryze-imagenes"
          git config user.email "imagenes@rnnclex.com"
          git add -A src
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Corregir rutas de imagenes en paginas hechas a mano (automatico)"
            git push
            gh workflow run deploy.yml --ref main
          fi
