name: Migrar contenido de WordPress

# Se ejecuta al subir un cambio a migration/RUN_MIGRATION en una rama (nunca en main).
# Copia el texto real de rnnclex.com (WordPress) a archivos Markdown de Astro, descarga sus imagenes
# y guarda un reporte en migration/report.json.
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'migration/RUN_MIGRATION'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar herramientas de migracion
        run: npm install --no-save cheerio turndown

      - name: Migrar contenido
        run: node scripts/migrate-from-wp.mjs

      - name: Guardar el contenido migrado en la rama
        run: |
          git config user.name "ryze-migracion"
          git config user.email "migracion@rnnclex.com"
          git add -A src/content public/images/wp migration/report.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Contenido migrado desde WordPress (automatico)"
            git push
          fi
